<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARGIN</title>
<style>
:root{--bg:#f5f3ee;--fg:#1a1a1a;--mute:#777;--line:#d8d4ca}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--fg:#eee;--mute:#999;--line:#333}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Helvetica Neue","Apple SD Gothic Neo",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:480px}
h1{font-size:40px;letter-spacing:.2em;margin:0 0 4px;font-weight:700}
p{color:var(--mute);margin:0 0 32px;font-size:14px}
a{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
a:last-child{border-bottom:1px solid var(--line)}
a:hover{opacity:.6}
a span{color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
<h1>MARGIN</h1>
<p>Aviation Safety Magazine</p>
<nav>
<a href="v1.6/">VOL. 1 · 6 EDITION <span>→</span></a>
</nav>
</main>
</body>
</html>
